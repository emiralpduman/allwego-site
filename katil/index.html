<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Seyahate katıl — AllWeGo</title>
  <!-- Davet linkinin yedek sayfası (T130): uygulama yüklüyse link doğrudan uygulamayı açar,
       değilse burası kodu gösterir. Başlık ve açıklama link önizlemesi için (L-K7). -->
  <meta name="description" content="AllWeGo'da grubunun seyahatine katıl — uygulamayı aç, grup kodunu gir.">
  <meta property="og:title" content="Seyahate katıl">
  <meta property="og:description" content="AllWeGo'da grubunun seyahatine katıl — uygulamayı aç, grup kodunu gir.">
  <meta property="og:site_name" content="AllWeGo">
  <meta name="theme-color" content="#E4622F">
  <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../assets/site.css">
</head>
<body>
  <header class="cover">
    <div class="cover-inner">
      <a class="brand" href="../"><img src="../assets/mascot.svg" alt="">AllWeGo</a>
      <h1>Seyahate katıl</h1>
      <p class="lede">Grubun seni bekliyor.</p>
    </div>
  </header>

  <main class="sheet">
    <div class="sheet-inner">
      <div class="card" id="code-card" hidden>
        <p class="meta">Grup kodun</p>
        <strong class="join-code" id="code"></strong>
      </div>

      <h2 class="section-title">Nasıl katılırım?</h2>
      <div class="card">
        <ol>
          <li>AllWeGo'yu aç.</li>
          <li>Seyahatler ekranında <strong>+</strong> → <strong>Koda Katıl</strong>'a dokun.</li>
          <li>Grup kodunu yaz.</li>
        </ol>
        <p class="muted">Sorun olursa: <a href="mailto:emiralpduman@gmail.com">emiralpduman@gmail.com</a></p>
      </div>
    </div>
  </main>

  <script>
    (function () {
      // Kod alfabesi uygulamayla aynı (I, O, 0, 1 yok); ayraç ve boşluk atılır.
      var raw = new URLSearchParams(window.location.search).get("kod") || "";
      var code = raw.toUpperCase().replace(/[\s\-–—_.]/g, "");
      if (/^[ABCDEFGHJKLMNPQRSTUVWXYZ23456789]{6}$/.test(code)) {
        document.getElementById("code").textContent = code;
        document.getElementById("code-card").hidden = false;
      }
    })();
  </script>
</body>
</html>
